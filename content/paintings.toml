# =============================================================================
#  CANVAS WOMAN — PAINTING INVENTORY
#  Every painting page, gallery card, filter, schema entry and WhatsApp link
#  is generated from this file. Nothing about a painting is written anywhere else.
#
#  ⚠  SAMPLE DATA ⚠
#  All 12 entries below are PLACEHOLDERS made for the build. Their titles,
#  prices, sizes, descriptions and images are NOT Sreeparna Poddar's paintings.
#  The images were generated by tools/placeholder-art/.
#
#  To go live: replace these entries with real works and delete  sample = true
#  from each one. While ANY entry still has  sample = true  the build runs in
#  preview mode — a notice is shown and every page is marked noindex.
#
#  FIELDS
#    id            unique reference, never reused               "CW-014"
#    slug          URL /paintings/<slug>/ — lowercase, hyphens  "azure-reverie"
#    title         artwork title
#    category      abstract | texture | landscape | pop
#    width, height numbers in the unit below (width first)
#    unit          "in" or "cm"
#    price         whole rupees, no commas; 0 = Price on Request
#    currency      "INR"
#    medium        e.g. "Acrylic on canvas"
#    availability  available | sold | commission | made-to-order
#    framing       short sentence
#    customizable  true / false  (shows the "Make it your own" section)
#    featured      true / false  (home page shows the first 4 by order)
#    order         sort order on the Paintings page, lower first
#    primary_image path inside content/images/
#    detail_images optional list — close-ups of the painting itself
#    room_images   optional list — interior / styled photos (labelled as such)
#    description   one or two short paragraphs (blank line between them)
# =============================================================================

